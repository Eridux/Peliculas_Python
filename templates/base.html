{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}
            
        {% endblock titulo %}
    </title>
    {% tailwind_css %}
</head>
<body class="bg-slate-600 h-screen">
    <!-- Layout principal -->
    <div class="flex flex-col h-screen">
        <header class="bg-gray-800 flex justify-center items-center text-white text-3xl font-bold p-2 shrink-0">
            {% block encabezado %}
                
            {% endblock encabezado %}
        </header>

        <main class="bg-gray-300 flex-1 overflow-y-auto p-5">
            <!-- <div class="min-h-[200vh] bg-white p-4 rounded-2xl shadow-2xl shadow-gray-800"> -->
                <div class="min-h-screen bg-white p-4 rounded-2xl shadow-2xl shadow-gray-800">
                    
                    {% block contenido %}
                        
                    {% endblock contenido %}

            </div>
        </main>

        <footer class="bg-gray-800 text-white p-2 shrink-0 flex justify-between items-center">
            <h3>Pie de página</h3>
        </footer>
    </div>
</body>
</html>
